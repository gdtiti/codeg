name: Deploy Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: deploy-hf-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render Hugging Face Space files
        env:
          GHCR_IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          mkdir -p .hf-space-build
          cp deploy/huggingface-space/README.md .hf-space-build/README.md
          sed "s|__GHCR_IMAGE__|${GHCR_IMAGE}|g" \
            deploy/huggingface-space/Dockerfile.template \
            > .hf-space-build/Dockerfile

      - name: Push Space repo to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN is required"
            exit 1
          fi
          if [ -z "${HF_SPACE_ID}" ]; then
            echo "HF_SPACE_ID is required"
            exit 1
          fi

          git clone "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" hf-space-repo
          rsync -av --delete .hf-space-build/ hf-space-repo/

          cd hf-space-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No Space changes to push"
            exit 0
          fi

          git add .
          git commit -m "Deploy image sha-${GITHUB_SHA}"
          git push origin main
